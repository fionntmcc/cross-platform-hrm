# Project: Hierarchical Reasoning Model for Puzzle Solving
# Authors: Kyrylo Kozlovskyi (G00425385), Fionn McCarthy (G00414386)
# Supervisor: Dr. John Healy
# Institution: Atlantic Technological University
# Duration: 2025/2026

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-platform-hrm"
version = "0.1.0"
description = "Cross-Platform Hierarchical Reasoning Model for constraint-satisfaction problems"
requires-python = ">=3.10"
dependencies = [
    # Core ML stack
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    # ONNX export + inference (used by scripts/export_onnx.py and scripts/solve_onnx.py)
    # onnxscript is required by PyTorch's dynamo exporter (opset 18)
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "onnxscript>=0.1.0",
]

[project.optional-dependencies]
# Plotting and TensorBoard logging (training curves, seed comparisons)
viz = [
    "matplotlib>=3.7.0",
    "tensorboard>=2.14.0",
]
# Full development environment: viz + tests + linters + pre-commit
dev = [
    "black>=24.10.0",
    "ruff>=0.8.6",
    "pre-commit>=3.7.0",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "matplotlib>=3.7.0",
    "tensorboard>=2.14.0",
]
# Edge / inference-only environments (Raspberry Pi, embedded).
# Listed for reference — install directly without this package:
#   pip install numpy onnxruntime
edge = [
    "numpy>=1.24.0",
    "onnxruntime>=1.17.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hrm*"]

# Black Configuration
[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
(
  hrm/prototype
  | scripts
)
'''

# Ruff Configuration
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["hrm", "test"]
exclude = ["hrm/prototype"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by Black)
    "B008",   # do not perform function call in argument defaults
    "N803",   # argument name should be lowercase (math notation: z_L, z_H)
    "N806",   # variable in function should be lowercase (math notation: z_L, z_H)
    "N812",   # uppercase import alias (torch.nn.functional as F is conventional)
    "RUF022", # __all__ not sorted (grouped by category with comments)
    "SIM108", # use ternary operator (can reduce readability)
    "RUF012", # mutable class variables (common in dataclasses)
    "UP007",  # use X | Y for union types (not always clearer)
]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = [
    "S101",   # use of assert (expected in tests)
    "N802",   # function name should be lowercase (test names can vary)
]
"hrm/training/logger.py" = [
    "SIM115", # open() without context manager — intentional for long-lived file handles
]
"hrm/prototype/**/*.py" = [
    "E",      # prototype code — relaxed style enforcement
    "W",
]

[tool.ruff.lint.isort]
known-first-party = ["hrm"]

# Pytest Configuration
[tool.pytest.ini_options]
testpaths = ["test/hrm_test", "test/other"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# Coverage Configuration
[tool.coverage.run]
source = ["hrm"]
omit = [
    "hrm/prototype/*",
    "hrm/__pycache__/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]

[tool.coverage.html]
directory = "htmlcov"
